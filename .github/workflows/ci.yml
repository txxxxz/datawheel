name: tests

on:
  push:
  pull_request:

jobs:
  local-loop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: datawheel run --input examples/tool_dialogues.jsonl --output runs/ci --rounds 2
      - run: python examples/model_http/replay.py --output runs/http-replay
